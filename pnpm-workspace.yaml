# The project is its own pnpm workspace root, so pnpm never walks up into a
# parent workspace when installing.
packages:
  - .

# The harness 0.1.7-alpha.2 line ships as prereleases; keep pnpm's release-age
# guard from refusing our pinned devDependencies.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-settings@0.1.7-alpha.2'
  - '@deepseek-ai/schemastery@3.18.4'
