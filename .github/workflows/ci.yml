name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The service CLI renders OS-native definitions (launchd plist, systemd
        # unit, Task Scheduler XML + PowerShell wrapper), so the same suite must
        # run on all three platforms: it is the only regression coverage those
        # renderers get without a real Windows/Linux host in the loop.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run guard:shadowed-peer
      - run: pnpm pack --dry-run
